name: pikachu-rl-qa

services:
  mongodb:
    image: mongo:7
    ports:
      - "27019:27017"
    volumes:
      - mongo_data_qa:/data/db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.runCommand('ping').ok && db.stats().ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8002:8000"
    volumes:
      - models_qa:/app/models
      - replays_qa:/app/replays
    env_file: .env.qa
    depends_on:
      mongodb:
        condition: service_healthy
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "--max-time", "3", "http://localhost:8000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # Frontend runs on yoonbian-2 (192.168.0.248:3001) via nginx
  # Deploy with: bash scripts/deploy-frontend.sh qa

volumes:
  mongo_data_qa:
  models_qa:
  replays_qa:
