[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pikachu-volleyball-rl"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "motor>=3.5.0",
    "pymongo>=4.8.0",
    "stable-baselines3>=2.3.0",
    "sb3-contrib>=2.3.0",
    "gymnasium>=0.29.0",
    "numpy>=1.26.0",
    "msgpack>=1.0.0",
    "torch>=2.3.0",
    "prometheus-fastapi-instrumentator>=7.0.0",
    "prometheus-client>=0.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
    "bandit[toml]>=1.7.9",
]

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# Default: exclude E2E tests that hit a live backend. Opt-in with `-m e2e`
# AFTER code is pushed + deployed — never against local in-dev code.
# Incident 2026-04-17: a full-suite run against localhost:8001 fired
# training:start/set_level/stop on the live dev backend and oxidised
# the running experiment.
addopts = "-m 'not e2e and not gpu'"
markers = [
    "e2e: end-to-end tests that connect to a live backend (httpx/WebSocket). Deselected by default; run explicitly only after a deploy.",
    "load: heavy concurrency/load tests (deselect with -m 'not load').",
    "gpu: tests that require a CUDA GPU. Deselected by default (addopts includes 'not gpu'); run explicitly with -m gpu on a GPU host. ADR 0018 Sprint-5 introduces the marker for Dreamer V3 world-model training.",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.bandit]
exclude_dirs = ["tests", "build", ".venv"]
skips = ["B101"]  # assert_used — pytest uses assert
