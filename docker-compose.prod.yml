name: pikachu-rl-prod

services:
  mongodb:
    image: mongo:7
    ports:
      - "27020:27017"
    volumes:
      - mongo_data_prod:/data/db
    restart: always
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.runCommand('ping').ok && db.stats().ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8003:8000"
    volumes:
      - models_prod:/app/models
      - replays_prod:/app/replays
    env_file: .env.prod
    environment:
      - MPLCONFIGDIR=/tmp/matplotlib
    depends_on:
      mongodb:
        condition: service_healthy
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "--max-time", "3", "http://localhost:8000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # Frontend runs on yoonbian-2 (192.168.0.248:3002) via nginx
  # Deploy with: bash scripts/deploy-frontend.sh prod

volumes:
  mongo_data_prod:
  models_prod:
  replays_prod:
