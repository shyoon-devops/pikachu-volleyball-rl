# Rate limiting (moderate for QA)
limit_req_zone $binary_remote_addr zone=qa_api:10m rate=45r/s;
limit_req_zone $binary_remote_addr zone=qa_ws:10m rate=10r/s;

server {
    listen 3001;
    server_name _;

    root /home/yoon/pikachu-frontend/qa/dist;
    index index.html;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 256;

    # Static assets
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # API proxy -> GPU server backend (moderate rate limit)
    location /api/ {
        limit_req zone=qa_api burst=70 nodelay;
        limit_req_status 429;

        proxy_pass http://192.168.0.250:8002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    # WebSocket proxy -> GPU server (rate limited)
    location /ws {
        limit_req zone=qa_ws burst=15 nodelay;
        limit_req_status 429;

        proxy_pass http://192.168.0.250:8002;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # SPA fallback.
    # HTML must never be long-cached — we ship new bundles with hashed asset
    # filenames, so the index.html is the one file that MUST be re-fetched
    # on every navigation to pick up the new <script src> references.
    # Security headers are re-declared here because nginx's add_header
    # inheritance resets parent (server-level) headers whenever a location
    # block declares any add_header of its own.
    location / {
        try_files $uri $uri/ /index.html;

        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }

    # Block sensitive paths
    location ~ /\. {
        deny all;
        return 404;
    }
}
