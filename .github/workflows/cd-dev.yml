name: CD - Dev

on:
  push:
    branches: [dev]

concurrency:
  group: cd-dev
  cancel-in-progress: false

jobs:
  deploy-dev:
    runs-on: self-hosted
    env:
      FRONTEND_HOST: ${{ vars.FRONTEND_HOST }}
      FRONTEND_SSH_HOST: ${{ vars.FRONTEND_SSH_HOST }}
      FRONTEND_SSH_KEY: ${{ vars.FRONTEND_SSH_KEY }}
      FRONTEND_REMOTE_BASE: ${{ vars.FRONTEND_REMOTE_BASE }}
      BACKEND_HOST: ${{ vars.BACKEND_HOST }}
      CORS_ORIGINS_DEV: ${{ vars.CORS_ORIGINS_DEV }}
      CORS_ORIGINS_PROD: ${{ vars.CORS_ORIGINS_PROD }}
    environment: development
    steps:
      - uses: actions/checkout@v4

      - name: Pre-deploy check
        run: |
          echo "Checking if training is running..."
          TRAINING_STATUS=$(curl -sf http://localhost:8001/api/health 2>/dev/null || echo "offline")
          echo "Backend status: $TRAINING_STATUS"

      - name: Deploy backend
        run: |
          docker compose -f docker-compose.dev.yml up --build -d
          echo "Waiting for healthy status..."
          timeout 60 bash -c 'until curl -sf http://localhost:8001/api/health; do sleep 3; done'

      - name: Deploy frontend
        run: bash scripts/deploy-frontend.sh dev

      - name: Verify deployment
        run: |
          echo "Backend health:"
          curl -sf http://localhost:8001/api/health
          echo ""
          echo "Frontend proxy:"
          ssh -o ConnectTimeout=5 -i "${FRONTEND_SSH_KEY/#\~/$HOME}" "$FRONTEND_SSH_HOST" \
            "curl -sf --connect-timeout 5 http://localhost:3000/api/health"
