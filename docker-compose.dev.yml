name: pikachu-rl-dev

services:
  mongodb:
    image: mongo:7
    ports:
      - "27018:27017"
    volumes:
      - mongo_data_dev:/data/db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.runCommand('ping').ok && db.stats().ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8001:8000"
    volumes:
      - ./backend:/app/backend
      - models_dev:/app/models
      - replays_dev:/app/replays
    env_file: .env.dev
    depends_on:
      mongodb:
        condition: service_healthy
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
    command: >
      python -m uvicorn backend.app.main:app
      --host 0.0.0.0 --port 8000 --reload
    healthcheck:
      test: ["CMD", "curl", "-f", "--max-time", "3", "http://localhost:8000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # Frontend runs on yoonbian-2 (192.168.0.248:3000) via nginx
  # Deploy with: bash scripts/deploy-frontend.sh dev
  #
  # For training (no --reload, no source mount):
  #   docker compose -f docker-compose.dev.yml -f docker-compose.dev-training.yml up -d

volumes:
  mongo_data_dev:
  models_dev:
  replays_dev:
