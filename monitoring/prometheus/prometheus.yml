global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - alerts.yml

scrape_configs:
  # Prometheus self-monitoring
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Host system metrics (CPU, memory, disk, network)
  - job_name: node-exporter
    static_configs:
      - targets: ["node-exporter:9100"]
        labels:
          host: gpu-server

  # Docker container metrics (CPU, memory, network per container)
  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]

  # NVIDIA GPU metrics (utilization, temperature, VRAM, power)
  - job_name: dcgm-exporter
    static_configs:
      - targets: ["dcgm-exporter:9400"]
        labels:
          gpu: "4070ti"

  # FastAPI backend metrics (API latency + training gauges)
  - job_name: backend-dev
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:8001"]
        labels:
          env: dev

  - job_name: backend-qa
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:8002"]
        labels:
          env: qa

  - job_name: backend-prod
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:8003"]
        labels:
          env: prod
