# Deployed Versions by Environment
#
# Source of truth for what is ACTUALLY running in each environment.
# MUST be updated by DevOps within 30 minutes of every deploy (see WORKFLOW.md § Post-Deploy Doc Update).
# Unverified fields are marked UNKNOWN and must be filled in via GitHub issue #38 or subsequent deploy reports.
#
# Verification protocol:
#   backend_commit     : source of truth is the git SHA baked into the container image at build time
#                        (e.g. LABEL org.opencontainers.image.revision, /etc/app-version, or API /api/version if later added)
#   frontend_commit    : git SHA of the source used for the build rsynced to yoonbian-2
#   frontend_bundle    : primary bundle filename from index.html (e.g. assets/index-<hash>.js)
#   backend_image      : `docker inspect <container> --format '{{.Image}}'`
#   last_deployed_at   : ISO-8601 in Asia/Seoul
#   last_verified_at   : when this YAML entry was last confirmed via curl + docker inspect

