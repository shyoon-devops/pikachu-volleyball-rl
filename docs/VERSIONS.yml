# =========================================================================
# DevOps update protocol:
#
#   1. Immediately before a deploy: open a PR to this file with the target
#      values filled in (even if UNKNOWN for commit — use the planned SHA).
#   2. Within 30 minutes of the deploy completing: update with actual
#      verified values (commit hash, image SHA, build time, deploy time).
#   3. Bump `last_file_update` to the commit time of the update.
#   4. Violations (no update within 30 min) → next deploy approval revoked
#      per WORKFLOW.md § Post-Deploy Doc Update.
#
# Port-change protocol (see WORKFLOW.md § Port Change Policy):
#   A port may not be changed without a PR to this file AND
#   DEPLOYMENT-STATUS.md AND README.md landed in the same commit as the
#   deploy script change. PM must approve the port change before deploy.
# =========================================================================
