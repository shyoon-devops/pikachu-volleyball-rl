<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 160">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16213e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f7d716" />
      <stop offset="100%" style="stop-color:#ffaa00" />
    </linearGradient>
  </defs>
  <rect width="600" height="160" rx="12" fill="url(#bg)"/>
  <rect x="20" y="75" width="560" height="2" fill="#333" rx="1"/>
  <!-- Net -->
  <rect x="298" y="55" width="4" height="40" fill="#666" rx="1"/>
  <line x1="298" y1="55" x2="298" y2="75" stroke="#888" stroke-width="1" stroke-dasharray="3,2"/>
  <!-- Ball -->
  <circle cx="340" cy="45" r="8" fill="url(#accent)" opacity="0.9"/>
  <!-- Title -->
  <text x="300" y="115" text-anchor="middle" fill="url(#accent)" font-family="monospace" font-size="28" font-weight="bold">PIKACHU VOLLEYBALL RL</text>
  <text x="300" y="140" text-anchor="middle" fill="#888" font-family="monospace" font-size="12">PPO Agent Training &amp; Real-time Dashboard</text>
  <!-- Decorative dots -->
  <circle cx="40" cy="30" r="3" fill="#f7d716" opacity="0.3"/>
  <circle cx="560" cy="30" r="3" fill="#f7d716" opacity="0.3"/>
  <circle cx="40" cy="130" r="3" fill="#f7d716" opacity="0.3"/>
  <circle cx="560" cy="130" r="3" fill="#f7d716" opacity="0.3"/>
</svg>
